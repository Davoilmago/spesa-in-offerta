name: Scarica volantini

on:
  # Pulsante "Run workflow" per le prove a mano.
  # Nel campo "catena" puoi scrivere per esempio: lidl  (se lo lasci vuoto scarica tutte le catene)
  workflow_dispatch:
    inputs:
      catena:
        description: "Catena da scaricare (vuoto = tutte)"
        required: false
        default: ""
  # Automatico: ogni giorno alle 07:00 UTC (08:00 o 09:00 in Italia).
  # Ogni catena sa in quali giorni scaricare (lo decide il file della catena, cartella catene/),
  # negli altri giorni non fa niente.
  schedule:
    - cron: "0 7 * * *"
  # Quando cambi i file dell'app (cartella sito) il sito si ripubblica da solo, senza riscaricare i volantini.
  push:
    paths:
      - "sito/**"
      - "prepara_sito.py"
      - ".github/workflows/scarica-volantini.yml"

# Evita che due avvii contemporanei si pestino i piedi.
concurrency:
  group: volantini
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scarica:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa il browser automatico
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scarica i volantini
        env:
          EVENTO: ${{ github.event_name }}
          CATENA: ${{ github.event.inputs.catena }}
        run: |
          if [ "$EVENTO" = "schedule" ]; then
            python scarica_volantini.py --solo-oggi
          else
            python scarica_volantini.py $CATENA
          fi

      - name: Salva i volantini nel progetto
        if: always()
        run: |
          git config user.name "volantini-bot"
          git config user.email "volantini-bot@users.noreply.github.com"
          git add volantini
          git diff --cached --quiet || git commit -m "Volantini aggiornati"
          git push

      - name: Conserva i file di controllo se qualcosa e' andato storto
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug
          if-no-files-found: ignore

  # Trasforma i PDF in pagine immagine e pubblica il sito (l'app) su GitHub Pages.
  pubblica:
    needs: scarica
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - name: Scarica il progetto (versione piu' recente, con i volantini nuovi)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa il programma che legge i PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      # Se un volantino non si converte, gli altri vengono pubblicati lo stesso e il lavoro risulta rosso alla fine.
      - name: Prepara le pagine dei volantini
        id: pagine
        continue-on-error: true
        run: python prepara_sito.py

      - name: Prepara la pubblicazione
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - name: Pubblica il sito
        id: pubblicazione
        uses: actions/deploy-pages@v4

      - name: Segnala eventuali errori nella preparazione delle pagine
        if: steps.pagine.outcome == 'failure'
        run: |
          echo "Qualche volantino non e' stato convertito: guarda il passaggio 'Prepara le pagine dei volantini'."
          exit 1
